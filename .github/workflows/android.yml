name: Android AAB

# Google Play'e yüklenecek Android App Bundle'ı (AAB) derler.
# Elle çalıştır: Actions sekmesi -> "Android AAB" -> Run workflow.
#
# İmzalı (Play'e yüklenebilir) sürüm için depo gizli değişkenleri
# (Settings -> Secrets and variables -> Actions -> Secrets):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_ALIAS, ANDROID_KEYSTORE_PASSWORD
# Gerçek reklamlar için depo değişkenleri (Variables sekmesi):
#   ADMOB_APP_ID, ADMOB_REWARDED_UNIT_ID, ADMOB_INTERSTITIAL_UNIT_ID
# Anahtar deposu tanımlı değilse test amaçlı debug anahtarıyla bir AAB üretilir (Play'e yüklenemez).
# İmzalı sürümde AdMob değişkenleri yoksa derleme bilerek başarısız olur (test reklamlarıyla yayın önlenir).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: "4.7-stable"
  GODOT_PATCH: "4.7.0"                 # AdMob Android eklentisi bu sürüme göre derlenir
  ADMOB_PLUGIN_COMMIT: "c75c79f"       # addons/admob ile aynı kaynak sürümü (sabitlenmiş)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.1 build-tools;36.0.0 cmake;3.10.2.4988404 ndk;28.1.13356709"

      - name: Godot ve dışa aktarma şablonlarını indir
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_RELEASE}_linux.x86_64" godot && chmod +x godot
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir" tpl && unzip -q templates.tpz -d tpl
          cp -r tpl/templates/* "$tdir/"

      - name: Godot düzenleyici ayarları (SDK ve JDK yolları)
        run: |
          set -e
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF2
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF2

      - name: Android derleme şablonunu kur
        run: |
          set -e
          mkdir -p android/build
          unzip -q "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore

      - name: AdMob Android eklentisini derle (sabit kaynak sürümünden)
        run: |
          set -e
          git clone https://github.com/poingstudios/godot-admob-plugin admob-src
          git -C admob-src checkout "$ADMOB_PLUGIN_COMMIT"
          cd admob-src/platforms/android
          chmod +x scripts/unix/download_godot.sh gradlew
          ./scripts/unix/download_godot.sh "$GODOT_PATCH"
          ./gradlew :src:core:assembleRelease :src:core:assembleDebug :src:ads:assembleRelease :src:ads:assembleDebug zipPlugins \
            -PgodotVersion="$GODOT_PATCH" --no-daemon
          cd ../../..
          mkdir -p addons/admob/android/bin addons/admob/ios/bin
          unzip -q -o "admob-src/platforms/android/.output/android-template-v${GODOT_PATCH}.zip" -d addons/admob/android/bin
          # Eklentinin başsız kipte var olmayan dosyaları indirmeye çalışmasını engelle
          printf 'const VERSION := "v5.2.0"\n' > addons/admob/android/bin/package.gd
          printf 'const VERSION := "v5.2.0"\n' > addons/admob/ios/bin/package.gd
          find addons/admob/android/bin -maxdepth 3 | head -30

      - name: Reklam kimliklerini yaz
        env:
          APP_ID: ${{ vars.ADMOB_APP_ID }}
          REWARDED: ${{ vars.ADMOB_REWARDED_UNIT_ID }}
          INTERSTITIAL: ${{ vars.ADMOB_INTERSTITIAL_UNIT_ID }}
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          set -e
          if [ -n "$APP_ID" ] && [ -n "$REWARDED" ] && [ -n "$INTERSTITIAL" ]; then
            sed -i "s#^general/android/app_id=.*#general/android/app_id=\"$APP_ID\"#" project.godot
            printf '{"rewarded":"%s","interstitial":"%s","test":false}\n' "$REWARDED" "$INTERSTITIAL" > config/ads.json
            echo "Gerçek AdMob kimlikleri yazıldı."
          elif [ "$HAS_KEYSTORE" = "true" ]; then
            echo "::error::İmzalı sürüm için ADMOB_APP_ID, ADMOB_REWARDED_UNIT_ID ve ADMOB_INTERSTITIAL_UNIT_ID depo değişkenleri tanımlı olmalı (test reklamlarıyla yayın yapılmaz)."
            exit 1
          else
            echo "::warning::AdMob değişkenleri yok; Google test reklam kimlikleri kullanılıyor."
          fi

      - name: Anahtar deposunu hazırla
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "MODE=release" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::Anahtar deposu gizli değişkenleri yok; test amaçlı debug anahtarıyla derleniyor (Play'e yüklenemez)."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "MODE=debug" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: İçe aktar ve AAB üret
        run: |
          set -e
          cp ci/android_preset.cfg export_presets.cfg
          mkdir -p build
          ./godot --headless --path . --import
          if [ "$MODE" = "release" ]; then
            ./godot --headless --path . --export-release "Android" build/neon-pulse.aab
          else
            ./godot --headless --path . --export-debug "Android" build/neon-pulse.aab
          fi
          ls -la build

      - name: AAB içeriğini doğrula (ikon, hedef SDK, izinler)
        run: |
          set -e
          echo "--- ikonlar"
          unzip -l build/neon-pulse.aab | grep -iE "res/.*(ic_launcher|icon)" | head -20 || true
          echo "--- sürüm ayarları"
          grep -nE "targetSdk|compileSdk|minSdk" android/build/config.gradle || true
          echo "--- bildirim"
          unzip -p build/neon-pulse.aab base/manifest/AndroidManifest.xml | strings | grep -iE "targetSdkVersion|permission|APPLICATION_ID|ca-app-pub" | head -20 || true

      - uses: actions/upload-artifact@v4
        with:
          name: neon-pulse-aab-${{ env.MODE }}
          path: build/neon-pulse.aab
          if-no-files-found: error
